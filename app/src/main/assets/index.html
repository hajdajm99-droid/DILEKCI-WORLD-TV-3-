<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dilekçi World TV</title>

<style>
body {
    margin: 0;
    background: #10172b;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

header {
    background: #172b50;
    padding: 30px;
    font-size: 32px;
    font-weight: bold;
    color: #00d9ff;
}

.container {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    padding: 35px;
}

.card {
    background: #243b64;
    padding: 35px 15px;
    border-radius: 15px;
    font-size: 23px;
}
</style>
</head>

<body>

<header>DİLEKÇİ WORLD TV</header>

<div class="container">
    <div class="card">📺 CANLI TV</div>
    <div class="card">🎬 FİLMLER</div>
    <div class="card">📽️ DİZİLER</div>
    <div class="card">🌍 BELGESELLER</div>
    <div class="card">⭐ FAVORİLER</div>
    <div class="card">⚙️ AYARLAR</div>
</div>

</body>
</html>
